<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Project card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); padding: 22px 28px; box-sizing: border-box; font-family: var(--font-sans); display: flex; gap: 16px; align-items: stretch; }
  .card {
    flex: 1; min-width: 0;
    background: var(--bg-surface);
    border: 1px solid var(--line-2);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(47,61,40,0.05), 0 1px 3px rgba(47,61,40,0.04);
    display: flex; flex-direction: column;
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .card.hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(47,61,40,0.08), 0 2px 6px rgba(47,61,40,0.04);
  }
  .img { aspect-ratio: 16/9; background-size: cover; background-position: center; background-color: var(--sage-100); }
  .body { padding: 14px 16px 16px; }
  .ttl { font-size: 16px; font-weight: 600; color: var(--fg-1); margin: 0 0 4px; letter-spacing: -0.01em; }
  .desc { font-size: 12.5px; color: var(--fg-2); margin: 0 0 10px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 10.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--sage-100); color: var(--sage-800); }
  .tag.sky { background: var(--sky-100); color: var(--sky-700); }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); position: absolute; top: 0; left: 0; padding: 6px 8px; background: rgba(255,255,255,0.85); border-bottom-right-radius: 8px; }
  .wrap { position: relative; flex: 1; min-width: 0; display: flex; }
</style>
</head>
<body>
  <div class="wrap"><span class="label">Default</span><div class="card"><div class="img" style="background-image:url('../assets/projects/rune-avatar.png')"></div><div class="body"><h3 class="ttl">Rune AI-Assistent</h3><p class="desc">Rune er en AI-assistent som svarer på spørsmål om min erfaring, bygget med LangChain.</p><div class="tags"><span class="tag">AI</span><span class="tag sky">LangChain</span><span class="tag sky">ChatBot</span></div></div></div></div>
  <div class="wrap"><span class="label">Hover</span><div class="card hover"><div class="img" style="background-image:url('../assets/projects/randi-fakturatolk.png')"></div><div class="body"><h3 class="ttl">Randi fakturaansvarlig</h3><p class="desc">En AI-agent som automatisk prosesserer og analyserer fakturaer — beløp, MVA, kontonummer.</p><div class="tags"><span class="tag">AI</span><span class="tag sky">OCR</span></div></div></div></div>
</body>
</html>
