<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Elevations</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); padding: 24px 28px; box-sizing: border-box; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .surface { width: 84px; height: 70px; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--line-1); }
  .xs { box-shadow: var(--shadow-xs); }
  .sm { box-shadow: var(--shadow-sm); }
  .md { box-shadow: var(--shadow-md); }
  .lg { box-shadow: var(--shadow-lg); }
  .xl { box-shadow: var(--shadow-xl); }
  .name { font-size: 12px; font-weight: 600; color: var(--fg-1); }
  .px   { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="row">
    <div class="tile"><div class="surface xs"></div><div class="name">xs</div><div class="px">--shadow-xs</div></div>
    <div class="tile"><div class="surface sm"></div><div class="name">sm</div><div class="px">--shadow-sm</div></div>
    <div class="tile"><div class="surface md"></div><div class="name">md</div><div class="px">--shadow-md</div></div>
    <div class="tile"><div class="surface lg"></div><div class="name">lg</div><div class="px">--shadow-lg</div></div>
    <div class="tile"><div class="surface xl"></div><div class="name">xl</div><div class="px">--shadow-xl</div></div>
  </div>
</body>
</html>
