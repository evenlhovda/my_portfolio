<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Corner radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); padding: 22px 28px; box-sizing: border-box; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .swatch { width: 80px; height: 80px; background: var(--sage-200); border: 1px solid var(--sage-400); }
  .name  { font-size: 12px; font-weight: 600; color: var(--fg-1); }
  .px    { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="row">
    <div class="tile"><div class="swatch" style="border-radius:4px"></div><div class="name">xs</div><div class="px">4&nbsp;px</div></div>
    <div class="tile"><div class="swatch" style="border-radius:6px"></div><div class="name">sm</div><div class="px">6&nbsp;px</div></div>
    <div class="tile"><div class="swatch" style="border-radius:10px"></div><div class="name">md</div><div class="px">10&nbsp;px</div></div>
    <div class="tile"><div class="swatch" style="border-radius:16px"></div><div class="name">lg</div><div class="px">16&nbsp;px</div></div>
    <div class="tile"><div class="swatch" style="border-radius:24px"></div><div class="name">xl</div><div class="px">24&nbsp;px</div></div>
    <div class="tile"><div class="swatch" style="border-radius:999px"></div><div class="name">pill</div><div class="px">∞</div></div>
  </div>
</body>
</html>
