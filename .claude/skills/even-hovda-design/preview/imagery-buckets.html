<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Imagery system</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); padding: 18px 24px; box-sizing: border-box; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1.4fr 1.4fr; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sage-700); margin: 0; }
  .name { font-size: 12.5px; font-weight: 600; color: var(--fg-1); margin: 0; }
  .rule { font-size: 10.5px; color: var(--fg-3); margin: 0; line-height: 1.4; }

  .img-portrait {
    aspect-ratio: 1;
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(135deg, #BCCFA9, #BDDEF2);
    box-shadow: var(--shadow-sm);
  }
  .img-portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    background: var(--c-mist);
  }

  .img-screenshot {
    aspect-ratio: 16/9;
    background: var(--sage-100);
    background-image: url('../assets/projects/randi-fakturatolk.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: var(--radius-md);
    border: 1px solid var(--line-1);
  }

  .img-editorial {
    aspect-ratio: 16/9;
    background-image: linear-gradient(rgba(95,107,115,0.55), rgba(95,107,115,0.55)), url('../assets/projects/snowkiting.webp');
    background-size: cover;
    background-position: center;
    border-radius: var(--radius-md);
    display: grid; place-items: end start;
    padding: 10px 14px;
    color: #fff;
    font-size: 14px; font-weight: 600;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <p class="label">01 · Portrait</p>
      <div class="img-portrait"><img src="../assets/portrait.png" alt=""></div>
      <p class="rule">Round, gradient ring. One per page.</p>
    </div>
    <div class="col">
      <p class="label">02 · Screenshot</p>
      <div class="img-screenshot"></div>
      <p class="rule">16:9, sage-100 letterbox. No drop shadow.</p>
    </div>
    <div class="col">
      <p class="label">03 · Editorial</p>
      <div class="img-editorial">Snøkiting på Jæren</div>
      <p class="rule">21:9 or 16:9, 55% slate wash. Hero only.</p>
    </div>
  </div>
</body>
</html>
