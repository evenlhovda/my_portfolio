<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-page);
    color: var(--fg-1);
    padding: 22px 24px;
    box-sizing: border-box;
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .role { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--line-2); background: var(--bg-surface); }
  .left { display: flex; flex-direction: column; gap: 2px; }
  .name { font-size: 13px; font-weight: 600; color: var(--fg-1); letter-spacing: -0.01em; }
  .desc { font-size: 11.5px; color: var(--fg-3); }
  .dot { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
</style>
</head>
<body>
  <div class="grid">
    <div class="role"><div class="left"><div class="name">Brand</div><div class="desc">var(--brand) · sage-500</div></div><div class="dot" style="background:#8FA77C"></div></div>
    <div class="role"><div class="left"><div class="name">Accent</div><div class="desc">var(--accent) · sky-400</div></div><div class="dot" style="background:#6BAFD8"></div></div>
    <div class="role"><div class="left"><div class="name">Highlight</div><div class="desc">var(--highlight) · spring</div></div><div class="dot" style="background:#DEF2D5"></div></div>
    <div class="role"><div class="left"><div class="name">Success</div><div class="desc">#5F9C5F</div></div><div class="dot" style="background:#5F9C5F"></div></div>
    <div class="role"><div class="left"><div class="name">Info</div><div class="desc">sky-500 #4892BF</div></div><div class="dot" style="background:#4892BF"></div></div>
    <div class="role"><div class="left"><div class="name">Warning</div><div class="desc">#C99A4C</div></div><div class="dot" style="background:#C99A4C"></div></div>
    <div class="role"><div class="left"><div class="name">Danger</div><div class="desc">#C5675B</div></div><div class="dot" style="background:#C5675B"></div></div>
    <div class="role"><div class="left"><div class="name">Muted</div><div class="desc">slate-400 #828A91</div></div><div class="dot" style="background:#828A91"></div></div>
  </div>
</body>
</html>
