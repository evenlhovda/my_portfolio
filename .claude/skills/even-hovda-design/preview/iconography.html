<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); padding: 20px 28px; box-sizing: border-box; font-family: var(--font-sans); }
  .group-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; }
  .item .icon { width: 28px; height: 28px; color: var(--slate-700); }
  .item .name { font-size: 10.5px; color: var(--fg-3); font-family: var(--font-mono); }
  .custom { width: 36px; height: 36px; border: 1px solid var(--line-2); background: var(--sage-50); border-radius: 8px; display: grid; place-items: center; }
  .custom img { width: 22px; height: 22px; }
</style>
</head>
<body>
  <p class="group-label">Lucide (default) · 1.5px stroke, currentColor</p>
  <div class="row">
    <div class="item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <span class="name">Mail</span>
    </div>
    <div class="item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      <span class="name">Linkedin</span>
    </div>
    <div class="item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="name">MapPin</span>
    </div>
    <div class="item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span class="name">Calendar</span>
    </div>
    <div class="item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="name">Users</span>
    </div>
    <div class="item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>
      <span class="name">Building</span>
    </div>
    <div class="item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      <span class="name">ArrowRight</span>
    </div>
  </div>
  <p class="group-label">Custom brand SVGs · assets/icons/</p>
  <div class="row">
    <div class="item"><div class="custom"><img src="../assets/icons/bot.svg" alt="" /></div><span class="name">bot</span></div>
    <div class="item"><div class="custom"><img src="../assets/icons/user.svg" alt="" /></div><span class="name">user</span></div>
    <div class="item"><div class="custom"><img src="../assets/icons/chat.svg" alt="" /></div><span class="name">chat</span></div>
  </div>
</body>
</html>
