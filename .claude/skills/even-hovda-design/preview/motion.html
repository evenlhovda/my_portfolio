<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Motion principles</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); padding: 20px 28px; box-sizing: border-box; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .demo { border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg-surface); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 140px; }
  .demo .label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); margin: 0; }
  .demo .name  { font-size: 14px; font-weight: 600; color: var(--fg-1); margin: 0; }
  .demo .desc  { font-size: 11.5px; color: var(--fg-2); margin: 0; line-height: 1.5; }
  .stage { flex: 1; display: grid; place-items: center; }

  .pulse { width: 36px; height: 36px; border-radius: 50%; background: var(--sage-500); animation: pulse 2.4s var(--ease-out) infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: 0.85; } }

  .lift { width: 60%; height: 32px; border-radius: 8px; background: var(--sage-100); border: 1px solid var(--sage-300); animation: lift 2.4s var(--ease-out) infinite; }
  @keyframes lift { 0%,100% { transform: translateY(0); box-shadow: var(--shadow-sm); } 50% { transform: translateY(-4px); box-shadow: var(--shadow-md); } }

  .fade { width: 70%; height: 32px; border-radius: 8px; background: var(--sky-200); animation: fade 2.4s var(--ease-out) infinite; }
  @keyframes fade { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="grid">
    <div class="demo">
      <p class="label">Hover · 200ms</p>
      <p class="name">Card lift</p>
      <div class="stage"><div class="lift"></div></div>
      <p class="desc">translateY(-2px) + shadow-md. No scale.</p>
    </div>
    <div class="demo">
      <p class="label">Enter · 360ms</p>
      <p class="name">Soft fade</p>
      <div class="stage"><div class="fade"></div></div>
      <p class="desc">opacity 0 → 1. Easing: ease-out.</p>
    </div>
    <div class="demo">
      <p class="label">Loop · 2.4s</p>
      <p class="name">Logo node pulse</p>
      <div class="stage"><div class="pulse"></div></div>
      <p class="desc">Slow, gentle scale 1 → 1.12. Never bouncy.</p>
    </div>
  </div>
</body>
</html>
