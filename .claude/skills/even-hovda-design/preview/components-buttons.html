<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); padding: 22px 28px; box-sizing: border-box; font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .group-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 10px; }
  button {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border 120ms ease, transform 120ms ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .primary   { background: var(--sage-500); color: #fff; }
  .primary:hover { background: var(--sage-600); }
  .secondary { background: var(--c-mist); color: var(--fg-1); border-color: var(--line-2); }
  .secondary:hover { background: var(--slate-100); }
  .accent    { background: var(--sky-500); color: #fff; }
  .accent:hover { background: var(--sky-600); }
  .ghost     { background: transparent; color: var(--sage-700); }
  .ghost:hover { background: var(--sage-50); }
  .outline   { background: transparent; color: var(--sage-700); border-color: var(--sage-400); }
  .outline:hover { background: var(--sage-50); }
  .danger    { background: #C5675B; color: #fff; }
  .small  { font-size: 13px; padding: 6px 12px; border-radius: 6px; }
  .large  { font-size: 15px; padding: 12px 22px; border-radius: 10px; }
</style>
</head>
<body>
  <p class="group-label">Variants</p>
  <div class="row">
    <button class="primary">Send melding</button>
    <button class="accent">Se demo</button>
    <button class="secondary">Avbryt</button>
    <button class="outline">Les mer</button>
    <button class="ghost">Lukk</button>
    <button class="danger">Slett</button>
  </div>
  <p class="group-label">Sizes</p>
  <div class="row">
    <button class="primary small">Liten</button>
    <button class="primary">Standard</button>
    <button class="primary large">Stor</button>
    <button class="primary" disabled style="opacity:0.5;cursor:not-allowed">Deaktivert</button>
  </div>
</body>
</html>
