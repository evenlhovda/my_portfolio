<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sage scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-page);
    color: var(--fg-1);
    padding: 20px 24px;
    box-sizing: border-box;
  }
  .scale { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .step { border-radius: var(--radius-sm); overflow: hidden; }
  .chip { height: 78px; }
  .meta { padding: 8px 6px 4px; text-align: center; }
  .meta .step-num { font-size: 11px; font-weight: 600; color: var(--fg-1); }
  .meta .hex  { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-3); }
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="label">Sage — primary brand scale</div>
  <div class="scale">
    <div class="step"><div class="chip" style="background:#F4F7F1"></div><div class="meta"><div class="step-num">50</div><div class="hex">F4F7F1</div></div></div>
    <div class="step"><div class="chip" style="background:#E6EDDF"></div><div class="meta"><div class="step-num">100</div><div class="hex">E6EDDF</div></div></div>
    <div class="step"><div class="chip" style="background:#D2DEC5"></div><div class="meta"><div class="step-num">200</div><div class="hex">D2DEC5</div></div></div>
    <div class="step"><div class="chip" style="background:#BCCFA9"></div><div class="meta"><div class="step-num">300</div><div class="hex">BCCFA9</div></div></div>
    <div class="step"><div class="chip" style="background:#AABF9B"></div><div class="meta"><div class="step-num">400 ●</div><div class="hex">AABF9B</div></div></div>
    <div class="step"><div class="chip" style="background:#8FA77C"></div><div class="meta"><div class="step-num">500</div><div class="hex">8FA77C</div></div></div>
    <div class="step"><div class="chip" style="background:#738B61"></div><div class="meta"><div class="step-num">600</div><div class="hex">738B61</div></div></div>
    <div class="step"><div class="chip" style="background:#5A6F4C"></div><div class="meta"><div class="step-num">700</div><div class="hex">5A6F4C</div></div></div>
    <div class="step"><div class="chip" style="background:#44563A"></div><div class="meta"><div class="step-num">800</div><div class="hex">44563A</div></div></div>
  </div>
</body>
</html>
